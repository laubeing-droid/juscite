<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Juscite 桌宠</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        cursor: default;
      }
      #pet-canvas {
        position: absolute;
        inset: 0;
      }
      /* 气泡：会话级单气泡位（RE-28 §3.2，v1 差异已记录在案） */
      #pet-bubble {
        position: absolute;
        max-width: 220px;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(28, 28, 32, 0.92);
        color: #f5f5f5;
        font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        display: none;
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #pet-bubble[data-tone="success"] {
        background: rgba(22, 101, 52, 0.94);
      }
      #pet-bubble[data-tone="warn"] {
        background: rgba(146, 64, 14, 0.94);
      }
      #pet-bubble[data-tone="error"] {
        background: rgba(127, 29, 29, 0.94);
      }
      /* 资产缺失/损坏可见提示（B15：绝不开透明空窗） */
      #pet-error {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(127, 29, 29, 0.94);
        color: #fff;
        font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
        display: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="pet-canvas"></canvas>
    <div id="pet-bubble" data-tone="info"></div>
    <div id="pet-error"></div>
    <script type="module" src="./src/pet/main.ts"></script>
  </body>
</html>
